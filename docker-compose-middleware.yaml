services:
  # Redis Cache & Token Store
  # 세션 정보, 캐시 및 ShedLock 분산 락 저장을 위한 인메모리 데이터 저장소입니다.
  redis:
    image: redis:alpine
    container_name: mopl-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - mopl-redis-data:/data
    networks:
      - mopl-network

  # Apache Kafka (KRaft Mode)
  # 비동기 이벤트 스트리밍 처리를 위한 카프카 브로커 및 컨트롤러 일체형 컨테이너입니다.
  # MIDDLEWARE_IP 환경변수에는 EC2 인스턴스의 Private IP(AWS 내부 통신용)를 기입해야 합니다.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mopl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://${MIDDLEWARE_IP:-localhost}:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - mopl-kafka-data:/var/lib/kafka/data
    networks:
      - mopl-network

  # Prometheus
  # 스프링 부트 애플리케이션의 Actuator 메트릭을 수집하여 시계열 데이터베이스에 보관하는 모니터링 수집 엔진입니다.
  prometheus:
    image: prom/prometheus:latest
    container_name: mopl-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/prometheus/'
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/prometheus/-/healthy" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - mopl-prometheus-data:/prometheus
    networks:
      - mopl-network

  # Grafana
  # 프로메테우스에서 수집된 시계열 메트릭을 시각적인 대시보드로 시각화해주는 대시보드 도구입니다.
  grafana:
    image: grafana/grafana:latest
    container_name: mopl-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/grafana/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - mopl-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - mopl-network
    depends_on:
      prometheus:
        condition: service_healthy

  # PostgreSQL Database (RDB)
  # 로컬 개발 및 디버깅 시 데이터를 영구 저장하기 위한 관계형 데이터베이스입니다.
  db:
    image: postgres:16-alpine
    container_name: mopl-db
    ports:
      - "5432:5432" # 로컬 호스트 포트 5432 개방
    environment:
      - POSTGRES_DB=${DB_NAME:-dev_db}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-your_dev_password}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mopl-postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    networks:
      - mopl-network

volumes:
  mopl-grafana-data:
  mopl-prometheus-data:
  mopl-kafka-data:
  mopl-redis-data:
  mopl-postgres-data:

networks:
  mopl-network:
    driver: bridge
