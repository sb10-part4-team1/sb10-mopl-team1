# ==========================================
# TEST 환경 (In-Memory H2)
# ==========================================
spring:
  config:
    activate:
      on-profile: test

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

  cloud:
    aws:
      s3:
        enabled: false
      credentials:
        access-key: "mock-access-key"
        secret-key: "mock-secret-key"
      region:
        static: "ap-northeast-2"

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE # PostgreSQL 모드 활성화
    username: sa
    password:

  mail:
    host: localhost
    port: 2525
    username: test
    password: test

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  sql:
    init:
      mode: always # 매번 시작할 때 schema.sql 실행

  jpa:
    hibernate:
      ddl-auto: none # SQL 스크립트로 제어하므로 JPA 자동 생성은 끔

mopl:
  jwt:
    secret: mopl-test-only-jwt-secret-key-at-least-32-bytes
    access-token-expiration: PT1H
    refresh-token-expiration: P14D
    refresh-token-cookie:
      name: REFRESH_TOKEN
      path: /api/auth
      http-only: true
      secure: false
      same-site: Lax
  admin:
    initializer:
      enabled: false
      overwrite-password: false
    account:
      email: test-admin@example.com
      name: test-admin
      password: test-admin-password
  tmdb:
    api:
      token: mock-tmdb-bearer-token-for-test # 테스트 환경용 가짜 토큰 지정
      base-url: https://api.themoviedb.org/3
  sports:
    api:
      base-url: https://www.thesportsdb.com/api/v1/json/123
