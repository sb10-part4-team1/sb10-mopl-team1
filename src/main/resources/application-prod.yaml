# ==========================================
# 3. PROD 환경 (AWS Container / RDS PostgreSQL)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod


  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mopl_db}
    username: ${DB_USERNAME:mopl_user}
    password: ${DB_PASSWORD:mopl_secure_password}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

  batch:
    jdbc:
      initialize-schema: never # 운영 환경에서는 배치 메타 테이블 자동 초기화 방지

  sql:
    init:
      mode: never # 운영은 절대로 schema.sql 자동 실행 금지

  jpa:
    hibernate:
      ddl-auto: validate # 운영 DB와 엔티티 구조가 일치하는지 검증만 수행
    show-sql: false # 성능 저하 및 보안을 위해 쿼리 로그 완전히 차단
    properties:
      hibernate:
        format_sql: false

# 보안을 위해 운영 환경에서는 외부 노출 축소
springdoc:
  api-docs:
    enabled: false # 운영에서는 스웨거 문서 숨김 (필요시 true 후 인증 보안 걸기)
  swagger-ui:
    enabled: false

mopl:
  jwt:
    refresh-token-cookie:
      secure: true

  datasource:
    api-pool-name: HikariPool-Prod-API
    api-pool-size: 15
    batch-pool-name: HikariPool-Prod-Batch
    batch-pool-size: 5

  mail:
    temporary-password:
      from: ${MOPL_TEMPORARY_PASSWORD_MAIL_FROM:${MAIL_USERNAME}}
