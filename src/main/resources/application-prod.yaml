# ==========================================
# 3. PROD 환경 (AWS Container / RDS PostgreSQL)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod


  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${AWS_RDS_ENDPOINT}:5432/prod_db
    username: ${AWS_RDS_USERNAME}
    password: ${AWS_RDS_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

  sql:
    init:
      mode: never # 운영은 절대로 schema.sql 자동 실행 금지

  jpa:
    hibernate:
      ddl-auto: validate # 운영 DB와 엔티티 구조가 일치하는지 검증만 수행
    show-sql: false # 성능 저하 및 보안을 위해 쿼리 로그 완전히 차단
    properties:
      hibernate:
        format_sql: false

# 보안을 위해 운영 환경에서는 외부 노출 축소
springdoc:
  api-docs:
    enabled: false # 운영에서는 스웨거 문서 숨김 (필요시 true 후 인증 보안 걸기)
  swagger-ui:
    enabled: false

mopl:
  jwt:
    refresh-token-cookie:
      secure: true

  datasource:
    api-pool-name: HikariPool-Prod-API
    api-pool-size: 30
    batch-pool-name: HikariPool-Prod-Batch
    batch-pool-size: 5

  mail:
    temporary-password:
      from: ${MOPL_TEMPORARY_PASSWORD_MAIL_FROM:${MAIL_USERNAME}}
