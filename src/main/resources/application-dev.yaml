# ==========================================
# 2. DEV 환경 (Local Docker PostgreSQL)
# ==========================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dev_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:your_dev_password}

  batch:
    jdbc:
      initialize-schema: never # 개발 도커 DB이므로 배치 메타 테이블 자동 초기화 방지

  sql:
    init:
      mode: never # 도커 DB이므로 schema.sql로 매번 밀지 않음, 초기 실행 때는 always로 테이블 생성 필요
  jpa:
    hibernate:
      ddl-auto: update # 엔티티 변경 사항이 있으면 DB에 자동으로 칼럼 등을 추가해 줌
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 부하 테스트 콘솔 I/O 병목 제거를 위한 로깅 최소화 (WARN 레벨)
logging:
  level:
    root: warn
    org.hibernate.SQL: off
    com.sb10.mopl.common.log: warn

mopl:
  datasource:
    api-pool-name: HikariPool-Dev-API
    api-pool-size: 15
    batch-pool-name: HikariPool-Dev-Batch
    batch-pool-size: 5

# Actuator 메트릭 상세 분석 설정 (Prometheus p99 백분위 분포 수집 활성화)
management:
  metrics:
    distribution:
      percentiles-histogram:
        mopl.api.call.duration.seconds: true
