<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>모두의 플리 임시 비밀번호 안내</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f7f9;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:0;padding:0;background-color:#f6f7f9;">
  <tr>
    <td align="center" style="padding:28px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background-color:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #e6e8ee;box-shadow:0 8px 20px rgba(17,24,39,0.05);">

        <tr>
          <td style="padding:28px 32px;background-color:#111827;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td style="font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;color:#ff6b8a;">
                  모두의 플리
                </td>
                <td align="right" style="font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;color:#d1d5db;">
                  계정 보안 안내
                </td>
              </tr>
            </table>

            <h1 style="margin:20px 0 0;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:26px;line-height:1.35;color:#ffffff;font-weight:800;">
              임시 비밀번호가 발급되었습니다.
            </h1>
          </td>
        </tr>

        <tr>
          <td style="padding:34px 32px 34px;">
            <p style="margin:0 0 22px;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.8;color:#374151;">
              요청하신 모두의 플리 계정의 임시 비밀번호를 안내드립니다.
            </p>

            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:24px 0 26px;border-radius:16px;background-color:#fff1f4;border:1px solid #ffd0dc;">
              <tr>
                <td align="center" style="padding:26px 20px;">
                  <div style="font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;font-weight:700;color:#be3455;">
                    임시 비밀번호
                  </div>

                  <div style="margin-top:10px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:32px;line-height:1.35;font-weight:800;letter-spacing:2px;color:#111827;word-break:break-all;">
                    {{temporaryPassword}}
                  </div>
                </td>
              </tr>
            </table>

            <p style="margin:0 0 10px;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;line-height:1.8;color:#4b5563;">
              발급 후 <strong style="color:#111827;">3분 동안만</strong> 사용할 수 있습니다.
            </p>

            <p style="margin:0 0 22px;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;line-height:1.8;color:#4b5563;">
              임시 비밀번호로 비밀번호 초기화 후 <strong style="color:#111827;">새 비밀번호로 변경</strong>해 주세요.
            </p>

            <p style="margin:0;padding-top:18px;border-top:1px solid #e5e7eb;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;line-height:1.75;color:#b45309;">
              본인이 요청하지 않은 경우, 계정 보호를 위해 비밀번호를 즉시 변경해 주세요.
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
